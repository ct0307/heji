# 放入nginx.conf的http上下文；map、limit_req_zone、log_format仅定义一次。
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=heji_login:10m rate=10r/m;
log_format heji_json escape=json '{"requestId":"$request_id","remote":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"requestSeconds":$request_time,"upstreamSeconds":"$upstream_response_time"}';
upstream heji_api { server 127.0.0.1:3001; keepalive 32; }

server {
    listen 80;
    server_name ledger.example;
    return 308 https://ledger.example$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ledger.example;
    ssl_certificate /etc/ssl/certs/heji-fullchain.pem;
    ssl_certificate_key /etc/ssl/private/heji-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log logs/heji_access.log heji_json;
    error_log logs/heji_error.log warn;
    root /srv/heji/apps/web/dist;
    index index.html;
    limit_req_status 429;
    client_max_body_size 32k;
    error_page 429 = @json_429;
    error_page 413 = @json_413;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location = /ws {
        proxy_pass http://heji_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
    location = /api/v1/auth/login {
        limit_req zone=heji_login burst=5 nodelay;
        proxy_pass http://heji_api;
        include deploy/nginx/proxy-headers.conf;
    }
    location ^~ /api/ {
        proxy_pass http://heji_api;
        include deploy/nginx/proxy-headers.conf;
    }
    location @json_429 { default_type application/json; return 429 '{"error":{"code":"RATE_LIMITED","message":"请求较多，请稍后重试","requestId":"$request_id"}}'; }
    location @json_413 { default_type application/json; return 413 '{"error":{"code":"INVALID_REQUEST","message":"请求正文超出限制","requestId":"$request_id"}}'; }
    location ~* \.(?:js|css|woff2)$ { expires 1y; add_header Cache-Control "public, immutable"; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; }
    location / { try_files $uri $uri/ /index.html; }
}

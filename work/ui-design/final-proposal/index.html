<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>合记 · 综合推荐方案</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="expenses.css">
  <link rel="stylesheet" href="../structure-v2/demo.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="账本导航">
      <div class="brand"><svg width="31" height="31" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="9" fill="currentColor"/><path d="M9 13h9a5 5 0 0 1 0 10h-3M23 19h-9a5 5 0 0 1 0-10h3" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/></svg><strong>合记</strong></div>
      <div class="current-book"><span class="book-mark">杭</span><div><strong>杭州周末</strong><span>共享账本 · 3 位成员</span></div></div>
      <nav id="primary-navigation" aria-label="主要页面"></nav>
      <div class="secondary-nav"><p>更多信息</p><button type="button" data-route="analysis">统计分析</button><button type="button" data-route="history">操作记录</button></div>
      <div class="sidebar-footer"><span class="avatar">宁</span><div><strong>阿宁</strong><span>当前演示账号</span></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb"><span>我的账本</span><span>/</span><strong>杭州周末</strong><span class="breadcrumb-detail">/ <span id="current-page-label">总览</span></span></div><div class="prototype-tools"><span class="prototype-label">交互草图 · 模拟数据</span><label class="sr-only" for="preview-mode">预览状态</label><select id="preview-mode"><option value="normal">正常数据</option><option value="empty">空账本</option><option value="offline">网络异常</option></select><button type="button" class="reset-button" data-reset>恢复样例</button></div></header>
      <div class="mobile-secondary"><span>杭州周末</span><button type="button" data-route="analysis">统计</button><button type="button" data-route="history">记录</button></div>
      <main id="main-content" tabindex="-1"></main>
      <noscript><p>请启用 JavaScript 后查看交互草图。</p></noscript>
    </div>
  </div>
  <nav id="mobile-navigation" class="mobile-nav" aria-label="手机快捷导航"></nav>
  <dialog class="demo-dialog" id="app-dialog" aria-labelledby="dialog-title"></dialog>
  <div class="app-toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>

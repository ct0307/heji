<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#235A4A" />
    <title>杭州周末 · 合记</title>
    <link rel="stylesheet" href="./a.css" />
    <script src="./a.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div id="app"></div>
    <dialog id="expense-dialog" class="expense-dialog" aria-labelledby="expense-title">
      <div class="dialog-header">
        <div><span class="eyebrow">杭州周末</span><h2 id="expense-title">记一笔</h2></div>
        <button type="button" class="icon-button" data-close-dialog aria-label="关闭记账表单"><span aria-hidden="true">×</span></button>
      </div>
      <form id="expense-form">
        <label class="form-label">花在什么地方<input name="title" autocomplete="off" maxlength="40" placeholder="例如：湖边咖啡" required /></label>
        <label class="form-label">金额（元）<input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required /></label>
        <label class="form-label">谁先垫付<select name="payer"><option>阿宁（我）</option><option>林悦</option><option>周然</option></select></label>
        <div class="form-members"><span>参与分摊</span><span><i class="mini-avatar avatar-an">宁</i><i class="mini-avatar avatar-lin">悦</i><i class="mini-avatar avatar-zhou">然</i> 全部 3 人</span></div>
        <p class="form-preview-note">这是记账交互预览，填写内容不会保存。</p>
        <button class="button primary form-submit" type="submit">体验记账</button>
      </form>
    </dialog>
    <dialog id="review-dialog" class="review-dialog" aria-labelledby="review-dialog-title">
      <div class="dialog-header"><div><span class="eyebrow">林悦的转账登记</span><h2 id="review-dialog-title">核对这笔收款</h2></div><button type="button" class="icon-button" data-close-dialog aria-label="关闭收款核对"><span aria-hidden="true">×</span></button></div>
      <div id="review-dialog-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
